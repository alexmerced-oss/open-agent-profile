name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"

      - name: Conformance suite
        run: pytest -q

      - name: Verify published conformance evidence
        run: python tools/verify_conformance_results.py

      - name: Verify support-library release versions
        run: python tools/verify_release_versions.py

      - name: Valid fixtures validate with no warnings
        run: oap-validate examples/*.agent.* examples/json tests/deltas/*.delta.yaml --strict

      - name: Invalid profile fixtures are rejected
        run: oap-validate examples/invalid/ --expect-invalid

      - name: Invalid delta fixtures are rejected
        run: oap-validate tests/deltas/invalid/ --expect-invalid

      - name: Skill scripts run
        run: |
          python skills/oap-agent-profile/scripts/oap_render.py examples/code-reviewer.agent.yaml > /dev/null
          python skills/oap-agent-profile/scripts/oap_render.py --list examples/ > /dev/null
          python skills/oap-session-writeback/scripts/oap_delta.py examples/code-reviewer.agent.yaml \
            --session-id ci --fact "A fact learned in CI.|ci|0.5" > /dev/null

      - name: Build and verify distributions
        if: matrix.python-version == '3.12'
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run audit:prod
      - run: npm pack --dry-run

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/oap-validate ./cmd/oap-apply
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file Cargo.lock

  rust-msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify
